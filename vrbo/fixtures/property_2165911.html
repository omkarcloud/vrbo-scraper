"HTML\"}}],\"leadingGraphic\":null,\"structuredData\":null}],\"maxColumns\":1}],\"actions\":null,\"expando\":null,\"maxColumns\":1}],\"action\":null,\"impressionAnalytics\":null,\"expando\":null}],\"action\":null,\"impressionAnalytics\":{\"__typename\":\"ClientSideImpressionEventAnalytics\",\"linkName\":\"Property Important Info\",\"referrerId\":\"HOT.HIS.PropertyImportantInfo\",\"event\":\"impression\"}},\"aboutThisProperty\":{\"__typename\":\"PropertyContentSectionGroup\",\"expando\":null,\"sectionName\":null,\"sections\":[{\"__typename\":\"PropertyContentSection\",\"sectionName\":null,\"header\":{\"__typename\":\"LodgingHeader\",\"text\":\"About this property\",\"subText\":null,\"icon\":null,\"headerImage\":null,\"mark\":null},\"bodySubSections\":[{\"__typename\":\"PropertyContentSubSection\",\"header\":null,\"elementsV2\":[{\"__typename\":\"PropertyContentElementGroup\",\"elements\":[{\"__typename\":\"PropertyContent\",\"maxColumns\":null,\"propertyContentRef\":null,\"header\":{\"__typename\":\"LodgingHeader\",\"text\":\"Piccolo Ponte 3 BR Caribbean Villa. Pool & Hot Tub. Canal front, SUP, Bikes.\",\"subText\":null,\"icon\":null,\"headerImage\":null,\"mark\":null},\"expando\":null,\"expandoPeek\":{\"__typename\":\"EGDSExpandoPeek\",\"expandedLabel\":\"See more\",\"collapsedLabel\":\"See less\",\"lines\":10,\"items\":null,\"expandAnalytics\":{\"__typename\":\"ClientSideAnalytics\",\"referrerId\":\"HOT.HIS.propertyContent\",\"linkName\":\"Shared ui property content section group expando\"},\"collapseAnalytics\":{\"__typename\":\"ClientSideAnalytics\",\"referrerId\":\"HOT.HIS.propertyContent\",\"linkName\":\"Shared ui property content section group expando\"}},\"items\":[{\"__typename\":\"PropertyContentItemMarkup\",\"content\":{\"__typename\":\"MarkupText\",\"text\":\"Piccolo Ponte is an elegant 3 bedroom waterfront Caribbean villa that sits on an acre of private tropical garden where friends and family gather together by the pool and on the dock to relax and enjoy a laid-back vacation island-style.\\u003Cbr\\u003E\\u003Cbr\\u003ELocated directly on the clear and turquoise canals of the prestigious Leeward Settlement, just a few minutes away from Blue Haven Marina and many beach accesses, the villa opens up to a sunny backyard featuring a natural shaped pool, heated SPA, BBQ grill, sun loungers and a dock where you can launch 2 SUPs and explore the neighborhood.\\u003Cbr\\u003E\\u003Cbr\\u003EPiccolo Ponte Main House has 2 spacious bedrooms with ensuite bathrooms, living room that sits 6 guests comfortably, a dining area and a kitchen with an island and breakfast area (plus laundry room). Sliding doors open up to the pool patio where you can eat outside and enjoy your coffee while the sun rises and warms you up.\\u003Cbr\\u003E\\u003Cbr\\u003EThe 3rd room is an adjacent guest house that is detached but still wraps around the property and is easily accessible through the small bridge over the pool. It has a queen bed, large bathroom, table and chairs, bar fridge and coffee maker. Excellent option for a bit more privacy with its private entry.\\u003Cbr\\u003E\\u003Cbr\\u003EAll bedrooms have ceiling fans, good ventilation and individually controlled AC. The main living area has ceiling fans and a good breeze through opened doors, bug screens but no AC.\\u003Cbr\\u003E\\u003Cbr\\u003EThe villa includes all amenities for a comfortable and restful vacation:\\u003Cbr\\u003E\\u003Cbr\\u003E-3 Bedrooms with renovated ensuite bathrooms \\u003Cbr\\u003E-All appliances for cooking and washing\\u003Cbr\\u003E-Bed linens, kitchen linens, bath towels, beach towels etc.\\u003Cbr\\u003E-Keyless entry pad\\u003Cbr\\u003E-Safes and alarm system\\u003Cbr\\u003E-AC in bedrooms and ceiling fans elsewhere.\\u003Cbr\\u003E-Smart TV with apps and Wifi capabilities\\u003Cbr\\u003E-Pool\\u003Cbr\\u003E-Heated SPA\\u003Cbr\\u003E-Indoor and outdoor dining spaces\\u003Cbr\\u003E-Outdoor BBQ\\u003Cbr\\u003E-Open plan kitchen\\u003Cbr\\u003E-Boat dock with stairs and ladder\\u003Cbr\\u003E-Stand Up paddle Boards\\u003Cbr\\u003E-Beach chairs, umbrella and cooler\\u003Cbr\\u003E-In a private gated community\\u003Cbr\\u003E\\u003Cbr\\u003EThe neighborhood and villa location is a haven for water sport enthusiasts. You can paddle board in the canal, head out to the main channel where nearby Mangrove Cay boasts incredible marine life with turtles, stingrays and juvenile sharks along with the brown pelicans, green herons and cute sandpipers. For the action driven, jet skis, fly board, e-foils and charter boats are just around the corner at the marina and boats can even come pick you up at the dock.\\u003Cbr\\u003E\\u003Cbr\\u003EStaff and Services Included:\\u003Cbr\\u003E-Concierge for activity and restaurant reservations\\u003Cbr\\u003E-Complimentary non-motorized water sport activities\\u003Cbr\\u003E-Complimentary bicycles\\u003Cbr\\u003E\\u003Cbr\\u003EAlso available at extra cost:\\u003Cbr\\u003E-Chef services\\u003Cbr\\u003E-In-house massage\\u003Cbr\\u003E-Daily housekeeping\\u003Cbr\\u003E-Villa Pre-stocking\\u003Cbr\\u003E-Babysitting\\u003Cbr\\u003E\\u003Cbr\\u003EYou will find us on line under Villa Piccolo Ponte TCI.\",\"markupType\":\"HTML\"}},{\"__typename\":\"PropertyContentItemMarkup\",\"content\":{\"__typename\":\"MarkupText\",\"text\":\"Our prices include all fees. No hidden fees.\",\"markupType\":\"HTML\"}}],\"leadingGraphic\":null,\"structuredData\":{\"__typename\":\"SEOStructuredData\",\"itemprop\":\"description\",\"itemscope\":false,\"itemtype\":\"https:\\u002F\\u002Fschema.org\\u002Fdescription\"}}],\"maxColumns\":1}],\"actions\":null,\"expando\":null,\"maxColumns\":1}],\"action\":null,\"impressionAnalytics\":null,\"expando\":{\"__typename\":\"LodgingExpandoPeek\",\"expanded\":false,\"collapseButton\":{\"__typename\":\"LodgingButton\",\"text\":\"See less about this property\",\"accessibilityLabel\":\"See less about this property\",\"analytics\":{\"__typename\":\"ClientSideAnalytics\",\"eventType\": ":\"Host has indicated there is a smoke detector on the property\",\"markupType\":\"HTML\"}},{\"__typename\":\"PropertyContentItemMarkup\",\"content\":{\"__typename\":\"MarkupText\",\"text\":\"Safety features at this property include a fire extinguisher, a first aid kit, and a deadbolt lock\",\"markupType\":\"HTML\"}},{\"__typename\":\"PropertyContentItemMarkup\",\"content\":{\"__typename\":\"MarkupText\",\"text\":\"This property has outdoor spaces, such as balconies, patios, terraces which may not be suitable for children; if you have concerns, we recommend contacting the property prior to your arrival to confirm they can accommodate you in a suitable room\",\"markupType\":\"HTML\"}}],\"leadingGraphic\":null,\"structuredData\":null}],\"maxColumns\":1}],\"actions\":null,\"expando\":null,\"maxColumns\":1}],\"action\":null,\"impressionAnalytics\":null,\"expando\":null}],\"action\":null,\"impressionAnalytics\":{\"__typename\":\"ClientSideImpressionEventAnalytics\",\"linkName\":\"Property Important Info\",\"referrerId\":\"HOT.HIS.PropertyImportantInfo\",\"event\":\"impression\"}},\"aboutThisProperty\":{\"__typename\":\"PropertyContentSectionGroup\",\"expando\":null,\"sectionName\":null,\"sections\":[{\"__typename\":\"PropertyContentSection\",\"sectionName\":null,\"header\":{\"__typename\":\"LodgingHeader\",\"text\":\"About this property\",\"subText\":null,\"icon\":null,\"headerImage\":null,\"mark\":null},\"bodySubSections\":[{\"__typename\":\"PropertyContentSubSection\",\"header\":null,\"elementsV2\":[{\"__typename\":\"PropertyContentElementGroup\",\"elements\":[{\"__typename\":\"PropertyContent\",\"maxColumns\":null,\"propertyContentRef\":null,\"header\":{\"__typename\":\"LodgingHeader\",\"text\":\"Piccolo Ponte 3 BR Caribbean Villa. Pool & Hot Tub. Canal front, SUP, Bikes.\",\"subText\":null,\"icon\":null,\"headerImage\":null,\"mark\":null},\"expando\":null,\"expandoPeek\":{\"__typename\":\"EGDSExpandoPeek\",\"expandedLabel\":\"See more\",\"collapsedLabel\":\"See less\",\"lines\":10,\"items\":null,\"expandAnalytics\":{\"__typename\":\"ClientSideAnalytics\",\"referrerId\":\"HOT.HIS.propertyContent\",\"linkName\":\"Shared ui property content section group expando\"},\"collapseAnalytics\":{\"__typename\":\"ClientSideAnalytics\",\"referrerId\":\"HOT.HIS.propertyContent\",\"linkName\":\"Shared ui property content section group expando\"}},\"items\":[{\"__typename\":\"PropertyContentItemMarkup\",\"content\":{\"__typename\":\"MarkupText\",\"text\":\"Piccolo Ponte is an elegant 3 bedroom waterfront Caribbean villa that sits on an acre of private tropical garden where friends and family gather together by the pool and on the dock to relax and enjoy a laid-back vacation island-style.\\u003Cbr\\u003E\\u003Cbr\\u003ELocated directly on the clear and turquoise canals of the prestigious Leeward Settlement, just a few minutes away from Blue Haven Marina and many beach accesses, the villa opens up to a sunny backyard featuring a natural shaped pool, heated SPA, BBQ grill, sun loungers and a dock where you can launch 2 SUPs and explore the neighborhood.\\u003Cbr\\u003E\\u003Cbr\\u003EPiccolo Ponte Main House has 2 spacious bedrooms with ensuite bathrooms, living room that sits 6 guests comfortably, a dining area and a kitchen with an island and breakfast area (plus laundry room). Sliding doors open up to the pool patio where you can eat outside and enjoy your coffee while the sun rises and warms you up.\\u003Cbr\\u003E\\u003Cbr\\u003EThe 3rd room is an adjacent guest house that is detached but still wraps around the property and is easily accessible through the small bridge over the pool. It has a queen bed, large bathroom, table and chairs, bar fridge and coffee maker. Excellent option for a bit more privacy with its private entry.\\u003Cbr\\u003E\\u003Cbr\\u003EAll bedrooms have ceiling fans, good ventilation and individually controlled AC. The main living area has ceiling fans and a good breeze through opened doors, bug screens but no AC.\\u003Cbr\\u003E\\u003Cbr\\u003EThe villa includes all amenities for a comfortable and restful vacation:\\u003Cbr\\u003E\\u003Cbr\\u003E-3 Bedrooms with renovated ensuite bathrooms \\u003Cbr\\u003E-All appliances for cooking and washing\\u003Cbr\\u003E-Bed linens, kitchen linens, bath towels, beach towels etc.\\u003Cbr\\u003E-Keyless entry pad\\u003Cbr\\u003E-Safes and alarm system\\u003Cbr\\u003E-AC in bedrooms and ceiling fans elsewhere.\\u003Cbr\\u003E-Smart TV with apps and Wifi capabilities\\u003Cbr\\u003E-Pool\\u003Cbr\\u003E-Heated SPA\\u003Cbr\\u003E-Indoor and outdoor dining spaces\\u003Cbr\\u003E-Outdoor BBQ\\u003Cbr\\u003E-Open plan kitchen\\u003Cbr\\u003E-Boat dock with stairs and ladder\\u003Cbr\\u003E-Stand Up paddle Boards\\u003Cbr\\u003E-Beach chairs, umbrella and cooler\\u003Cbr\\u003E-In a private gated community\\u003Cbr\\u003E\\u003Cbr\\u003EThe neighborhood and villa location is a haven for water sport enthusiasts. You can paddle board in the canal, head out to the main channel where nearby Mangrove Cay boasts incredible marine life with turtles, stingrays and juvenile sharks along with the brown pelicans, green herons and cute sandpipers. For the action driven, jet skis, fly board, e-foils and charter boats are just around the corner at the marina and boats can even come pick you up at the dock.\\u003Cbr\\u003E\\u003Cbr\\u003EStaff and Services Included:\\u003Cbr\\u003E-Concierge for activity and restaurant reservations\\u003Cbr\\u003E-Complimentary non-motorized water sport activities\\u003Cbr\\u003E-Complimentary bicycles\\u003Cbr\\u003E\\u003Cbr\\u003EAlso available at extra cost:\\u003Cbr\\u003E-Chef services\\u003Cbr\\u003E-In-house massage\\u003Cbr\\u003E-Daily housekeeping\\u003Cbr\\u003E-Villa Pre-stocking\\u003Cbr\\u003E-Babysitting\\u003Cbr\\u003E\\u003Cbr\\u003EYou will find us on line under Villa Piccolo Ponte TCI.\",\"markupType\":\"HTML\"}},{\"__typename\":\"PropertyContentItemMarkup\",\"content\":{\"__typename\":\"MarkupText\",\"text
